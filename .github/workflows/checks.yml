name: ScopeDesk checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python scripts/manage.py test
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: scope, POSTGRES_PASSWORD: scope, POSTGRES_DB: scope_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U scope -d scope_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python scripts/manage.py test-postgres
        env:
          SCOPEDESK_TEST_DATABASE_URL: postgresql://scope:scope@localhost:5432/scope_test
